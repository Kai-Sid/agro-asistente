name: CI

on:
  push:
    branches: [main, owasp]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests without live MySQL
        env:
          RATE_LIMIT_ENABLED: "false"
          APP_ENV: test
        run: >
          pytest -q
          --ignore=tests/test_login_endpoint.py
          --ignore=tests/test_register_endpoint.py
          --ignore=tests/test_context_endpoint.py
          --ignore=tests/test_query_endpoint.py
          --ignore=tests/test_rag_endpoint.py
          --ignore=tests/test_knowledge_endpoint.py
          --ignore=tests/test_weather_endpoint.py
          --ignore=tests/test_senamhi_wis2_integration.py
          -k "not mysql and not integration"
        continue-on-error: false
